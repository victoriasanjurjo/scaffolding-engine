[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-scaffold"
version = "1.0.0"
description = "Motor de scaffolding local en Python que genera estructuras de proyectos a partir de especificaciones Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Senior Architect" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
scaffold = "src.scaffold.cli:main"
md-scaffold = "src.scaffold.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
